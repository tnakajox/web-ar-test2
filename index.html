<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>高島屋 ローズAR体験</title>
  <!-- MindAR Face Tracking & A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* UIレイアウト */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 80px;
    }

    /* ボタン共通スタイル */
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ff758c;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #d81b60;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.92);
    }

    /* カメラ切替ボタン */
    #switch-cam-btn {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
    }

    /* 花を咲かせるメインボタン */
    #flower-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      font-size: 18px;
      padding: 15px 28px;
    }

    /* シャッターボタン */
    #shutter-btn {
      width: 62px;
      height: 62px;
      padding: 0;
      border-radius: 50%;
      font-size: 26px;
      background: #ffffff;
      border: 4px solid #ff758c;
      line-height: 54px;
      text-align: center;
    }

    /* 2Dお花パーティクル用コンテナ */
    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 900;
      overflow: hidden;
    }

    .flower-particle {
      position: absolute;
      user-select: none;
      will-change: transform, opacity;
      animation: fallAndRotate linear forwards;
    }

    @keyframes fallAndRotate {
      0% {
        top: -10%;
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
      100% {
        top: 105%;
        opacity: 0.8;
        transform: translateX(var(--drift-x)) rotate(var(--rot-deg));
      }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>

  <div class="ui-container">
    <div class="top-bar">
      <button id="switch-cam-btn" class="btn">🔄</button>
    </div>

    <div class="bottom-bar">
      <button id="flower-btn" class="btn">🌸 花を咲かせる</button>
      <button id="shutter-btn" class="btn">📸</button>
    </div>
  </div>

  <!-- Face Tracking用のシーン構成 -->
  <a-scene 
    mindar-face 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, preserveDrawingBuffer: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- 顔を検知するエンティティ -->
    <a-entity mindar-face-target="anchorIndex: 1">
      <!-- 動作確認用の小さなお花（鼻の頭付近に配置） -->
      <a-text value="🌸" position="-0.15 0 0" scale="1.5 1.5 1.5"></a-text>
    </a-entity>
  </a-scene>

  <script>
    const flowerBtn = document.querySelector('#flower-btn');
    const shutterBtn = document.querySelector('#shutter-btn');
    const switchCamBtn = document.querySelector('#switch-cam-btn');
    const particleContainer = document.querySelector('#particle-container');
    const sceneEl = document.querySelector('a-scene');

    const flowerEmojis = ['🌸', '🌷', '🌼', '🌺', '🌹'];

    // 「花を咲かせる」ボタンを押したときの処理
    flowerBtn.addEventListener('click', () => {
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          createFlowerParticle();
        }, i * 50);
      }
    });

    function createFlowerParticle() {
      const el = document.createElement('div');
      el.className = 'flower-particle';
      
      const emoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
      el.textContent = emoji;

      const startLeft = Math.random() * 100;
      el.style.left = startLeft + 'vw';

      const fontSize = 24 + Math.random() * 24;
      el.style.fontSize = fontSize + 'px';

      const duration = 2.5 + Math.random() * 2.0;
      el.style.animationDuration = duration + 's';

      const driftX = (Math.random() - 0.5) * 200;
      const rotDeg = 180 + Math.random() * 540;
      el.style.setProperty('--drift-x', driftX + 'px');
      el.style.setProperty('--rot-deg', rotDeg + 'deg');

      particleContainer.appendChild(el);

      setTimeout(() => {
        if (el.parentNode) {
          el.parentNode.removeChild(el);
        }
      }, duration * 1000);
    }

    // カメラ切替ボタンの処理
    switchCamBtn.addEventListener('click', () => {
      const mindarSystem = sceneEl.systems["mindar-face-system"];
      if (mindarSystem) {
        mindarSystem.switchCamera();
      }
    });

    // 撮影ボタンの処理
    shutterBtn.addEventListener('click', () => {
      const canvas = sceneEl.components.screenshot.getCanvas('perspective');
      if (canvas) {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'takashimaya-rose-ar.png';
        link.href = image;
        link.click();
      }
    });
  </script>
</body>
</html>
