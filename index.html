<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>高島屋 ローズAR体験</title>
  <!-- MindAR & A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* 全体UIレイアウト */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
    }

    /* 下部ボタンエリア：従来より少し高めの位置に調整 */
    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 110px; /* ★ボタンを上方向に引き上げました */
    }

    /* ボタン共通スタイル */
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ff758c;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #d81b60;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.92);
    }

    /* カメラ切替ボタン */
    #switch-cam-btn {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 22px;
      line-height: 50px;
      text-align: center;
    }

    /* 花を咲かせるメインボタン */
    #flower-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      font-size: 18px;
      padding: 15px 28px;
      display: none; /* マーカー検知まで非表示 */
    }

    /* シャッターボタン */
    #shutter-btn {
      width: 62px;
      height: 62px;
      padding: 0;
      border-radius: 50%;
      font-size: 26px;
      background: #ffffff;
      border: 4px solid #ff758c;
      display: none; /* マーカー検知まで非表示 */
      line-height: 54px;
      text-align: center;
    }

    /* 2Dお花パーティクル用コンテナ */
    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 900;
      overflow: hidden;
    }

    /* お花エレメントのアニメーション */
    .flower-particle {
      position: absolute;
      user-select: none;
      will-change: transform, opacity;
      animation: fallAndRotate linear forwards;
    }

    @keyframes fallAndRotate {
      0% {
        top: -10%;
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
      100% {
        top: 105%;
        opacity: 0.8;
        transform: translateX(var(--drift-x)) rotate(var(--rot-deg));
      }
    }
  </style>
</head>
<body>

  <!-- お花アニメーション用のコンテナ -->
  <div id="particle-container"></div>

  <!-- UIオーバーレイ -->
  <div class="ui-container">
    <div class="top-bar">
      <!-- 反転（カメラ切替）ボタン -->
      <button id="switch-cam-btn" class="btn">🔄</button>
    </div>

    <div class="bottom-bar">
      <!-- 花を咲かせるボタン -->
      <button id="flower-btn" class="btn">🌸 花を咲かせる</button>
      <!-- シャッターボタン -->
      <button id="shutter-btn" class="btn">📸</button>
    </div>
  </div>

  <!-- ARシーン設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, preserveDrawingBuffer: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカーターゲット -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    const targetEl = document.querySelector('#example-target');
    const flowerBtn = document.querySelector('#flower-btn');
    const shutterBtn = document.querySelector('#shutter-btn');
    const switchCamBtn = document.querySelector('#switch-cam-btn');
    const particleContainer = document.querySelector('#particle-container');
    const sceneEl = document.querySelector('a-scene');

    // 降らせるお花（絵文字）のリスト
    const flowerEmojis = ['🌸', '🌷', '🌼', '🌺', '🌹'];

    // 1. マーカー検知時のボタン表示コントロール
    targetEl.addEventListener("targetFound", () => {
      flowerBtn.style.display = "block";
      shutterBtn.style.display = "block";
    });

    targetEl.addEventListener("targetLost", () => {
      flowerBtn.style.display = "none";
      shutterBtn.style.display = "none";
    });

    // 2. 「花を咲かせる」ボタンを押したときの処理
    flowerBtn.addEventListener('click', () => {
      // 1回のタップで25個のお花を画面全体に降らせる
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          createFlowerParticle();
        }, i * 50); // 少しずつずらして出現
      }
    });

    function createFlowerParticle() {
      const el = document.createElement('div');
      el.className = 'flower-particle';
      
      // 絵文字のランダム選定
      const emoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
      el.textContent = emoji;

      // 画面横幅のどこから落ちてくるかをランダム指定 (0% 〜 100%)
      const startLeft = Math.random() * 100;
      el.style.left = startLeft + 'vw';

      // サイズのランダム指定 (24px 〜 48px)
      const fontSize = 24 + Math.random() * 24;
      el.style.fontSize = fontSize + 'px';

      // 舞い落ちる時間 (2.5秒 〜 4.5秒)
      const duration = 2.5 + Math.random() * 2.0;
      el.style.animationDuration = duration + 's';

      // 左右への揺れ幅 (-100px 〜 +100px) と回転角 (180deg 〜 720deg)
      const driftX = (Math.random() - 0.5) * 200;
      const rotDeg = 180 + Math.random() * 540;
      el.style.setProperty('--drift-x', driftX + 'px');
      el.style.setProperty('--rot-deg', rotDeg + 'deg');

      particleContainer.appendChild(el);

      // 落ち切ったら要素を削除
      setTimeout(() => {
        if (el.parentNode) {
          el.parentNode.removeChild(el);
        }
      }, duration * 1000);
    }

    // 3. 反転（インカメラ / アウトカメラ切替）ボタンの処理
    switchCamBtn.addEventListener('click', () => {
      const mindarSystem = sceneEl.systems["mindar-image-system"];
      if (mindarSystem) {
        mindarSystem.switchCamera();
      }
    });

    // 4. シャッター（撮影・保存）ボタンの処理
    shutterBtn.addEventListener('click', () => {
      const canvas = sceneEl.components.screenshot.getCanvas('perspective');
      if (canvas) {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'takashimaya-rose-ar.png';
        link.href = image;
        link.click();
      }
    });
  </script>
</body>
</html>
