<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>高島屋 ローズAR体験</title>
  <!-- MindAR & A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }

    /* UIコンテナ */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* AR画面の操作を妨げない */
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }

    /* ボタン共通スタイル */
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ff758c;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #d81b60;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.92);
    }

    /* カメラ切替ボタン */
    #switch-cam-btn {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 20px;
    }

    /* 花を咲かせるメインボタン */
    #flower-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      font-size: 18px;
      padding: 15px 30px;
      display: none; /* マーカー検知まで非表示 */
    }

    /* シャッターボタン */
    #shutter-btn {
      width: 60px;
      height: 60px;
      padding: 0;
      border-radius: 50%;
      font-size: 24px;
      background: #ffffff;
      border: 4px solid #ff758c;
      display: none; /* マーカー検知まで非表示 */
    }
  </style>
</head>
<body>

  <!-- UIオーバーレイ -->
  <div class="ui-container">
    <div class="top-bar">
      <!-- 反転（カメラ切替）ボタン -->
      <button id="switch-cam-btn" class="btn">🔄</button>
    </div>

    <div class="bottom-bar">
      <!-- 花を降らせるボタン -->
      <button id="flower-btn" class="btn">🌸 花を咲かせる</button>
      <!-- シャッターボタン -->
      <button id="shutter-btn" class="btn">📸</button>
    </div>
  </div>

  <!-- ARシーン設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, preserveDrawingBuffer: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- カメラ（このカメラに花びらを追従させて画面全体に降らせます） -->
    <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false">
      <a-entity id="screen-flower-container" position="0 0 -1.5"></a-entity>
    </a-camera>

    <!-- マーカーターゲット -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    const targetEl = document.querySelector('#example-target');
    const flowerBtn = document.querySelector('#flower-btn');
    const shutterBtn = document.querySelector('#shutter-btn');
    const switchCamBtn = document.querySelector('#switch-cam-btn');
    const container = document.querySelector('#screen-flower-container');
    const sceneEl = document.querySelector('a-scene');

    // 降らせるお花（絵文字）のリスト
    const flowerEmojis = ['🌸', '🌷', '🌼', '🌺', '🌹'];

    // 1. マーカー検知時のボタン表示コントロール
    targetEl.addEventListener("targetFound", () => {
      flowerBtn.style.display = "block";
      shutterBtn.style.display = "block";
    });

    targetEl.addEventListener("targetLost", () => {
      flowerBtn.style.display = "none";
      shutterBtn.style.display = "none";
    });

    // 2. 「花を咲かせる」ボタンを押したときの処理（画面全体に咲かせる）
    flowerBtn.addEventListener('click', () => {
      for (let i = 0; i < 20; i++) {
        createScreenPetal();
      }
    });

    function createScreenPetal() {
      const textEntity = document.createElement('a-text');
      
      // ランダムに絵文字を選出
      const emoji = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
      
      // 画面全体（カメラの視界内）に散らばるよう、x, y を幅広くランダム設定
      const x = (Math.random() - 0.5) * 2.2; // 画面の左右幅
      const y = 1.0 + Math.random() * 0.5;   // 画面の上側から出現
      const z = (Math.random() - 0.5) * 0.5; // 奥行きの微調整

      textEntity.setAttribute('value', emoji);
      textEntity.setAttribute('align', 'center');
      textEntity.setAttribute('scale', '0.4 0.4 0.4');
      textEntity.setAttribute('position', `${x} ${y} ${z}`);

      // 上から下にゆっくり舞い落ちるアニメーション
      textEntity.setAttribute('animation__fall', {
        property: 'position',
        to: `${x + (Math.random() - 0.5) * 0.4} ${y - 2.2} ${z}`,
        dur: 2500 + Math.random() * 1500,
        easing: 'ease-out-quad'
      });

      // 揺れるような回転アニメーション
      textEntity.setAttribute('animation__rot', {
        property: 'rotation',
        to: `0 0 ${Math.random() > 0.5 ? 360 : -360}`,
        dur: 3000,
        easing: 'linear'
      });

      container.appendChild(textEntity);

      // アニメーション終了後に削除して動作を軽快に保つ
      setTimeout(() => {
        if (textEntity.parentNode) {
          textEntity.parentNode.removeChild(textEntity);
        }
      }, 4000);
    }

    // 3. 反転（インカメラ / アウトカメラ切替）ボタンの処理
    let isFrontCamera = false;
    switchCamBtn.addEventListener('click', () => {
      const mindarSystem = sceneEl.systems["mindar-image-system"];
      if (mindarSystem) {
        mindarSystem.switchCamera();
      }
    });

    // 4. シャッター（撮影・保存）ボタンの処理
    shutterBtn.addEventListener('click', () => {
      // A-Frameのキャンバスから画像を生成
      const canvas = sceneEl.components.screenshot.getCanvas('perspective');
      
      if (canvas) {
        // 画像リンクを作って自動ダウンロード保存
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'takashimaya-rose-ar.png';
        link.href = image;
        link.click();
      }
    });
  </script>
</body>
</html>
